<title id="diligence-study-title">Claims, evidence and confidence</title>
<desc id="diligence-study-desc">An illustrative diligence worksheet separates what is asserted, what can be checked and what remains uncertain. The drawing contains no scores, ratings or assessment of a real business.</desc>
